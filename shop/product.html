<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Perfume</title>

    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Roboto&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Roboto;
        }

        body {
            background-color: #ff7fb1;
            background-image: url("../assets/Background.jpeg");
            background-repeat: repeat;
            background-position: center top;
            background-size: 1200px auto;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Tablet */
        @media (min-width:600px) {
            body {
                background-size: 680px auto;
            }
        }

        /* mobile */
        @media (min-width:420px) {
            body {
                background-size: 700px auto;
            }
        }

        /* Laptop & Desktop */
        @media(min-width:901px) {
            .grid {
                grid-template-columns: repeat(1, 1fr);
            }

            body {
                /* background-repeat: repeat; */
                background-size: 520px auto;
                background-position: center top;
            }
        }

        .frame {
            max-width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(6px);
            border: 4px solid #ee73b2;
            animation: fade .8s ease;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: larger;
        }

        .box {
            background: #111;
            color: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }

        img {
            width: 100%;
            border-radius: 20px;
            animation: float 4s ease-in-out infinite;
        }

        .title {
            font-family: Coiny;
            color: #ee73b2;
            font-size: 26px;
            margin-top: 12px;
        }

        .btn {
            display: block;
            margin-top: 10px;
            padding: 12px 0;
            background: linear-gradient(#ff6fa9, #ff8cc0);
            border-radius: 28px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-align: center;

            transition: all .18s ease;
            animation: pulse 2.5s infinite;
        }

        /* Hover (desktop) */
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 22px rgba(255, 105, 150, .45);
            filter: brightness(1.08);
        }

        /* Tap (mobile) */
        .btn:active {
            transform: scale(.96);
            opacity: .9;
            box-shadow: none;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 105, 150, .55);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 105, 150, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 105, 150, 0);
            }
        }

        @keyframes float {
            50% {
                transform: translateY(-10px)
            }
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1
            }
        }
    </style>
</head>

<body>

    <div class="frame">
        <a class="back" href="catalog.html">← Back</a>

        <div class="box">
            <img id="img">
            <div class="title" id="name"></div>
            <p id="desc"></p>
            <h4 id="size"></h4>
            <h3 id="price"></h3>

            <a id="wa" class="btn">Buy via WhatsApp</a>
            <a id="shopee" class="btn">Buy via Shopee</a>
        </div>
    </div>

    <script>
        const data = {
            amber: {
                name: "Amber Cherry",
                price: "Rp 45.000",
                desc: "✨ Amber Cherry Sweet Cherry - Vanila - Almond - Amber & Woody Menggambarkan perpaduan utama antara manisnya buah ceri dan hangatnya amber",
                size: "ZARA Parfums 10ml",
                img: "../img-perfumes/Amber Cherry.jpeg",
                wa: "https://wa.me/6285737416686?text=Halo kak, saya mau Order Amber Cherry",
                shopee: "https://id.shp.ee/4y1W7k1"
            },
            desert: {
                name: "Desert Gold Oud",
                price: "Rp 45.000",
                desc: "✨ Desert Gold Oud Parfum unisex dengan karakter warm spicy – oud – tobacco yang bold dan elegan. Aroma mewah , intens , dan meninggalkan kesan berkelas sepanjang hari",
                size: "ZARA Parfums 10ml",
                img: "../img-perfumes/Desert Gold Oud.jpeg",
                wa: "https://wa.me/6285737416686?text=Halo kak, saya mau Order Desert Gold Oud",
                shopee: "https://id.shp.ee/4y1W7k1"
            },
            marine: {
                name: "Marine Velvet",
                price: "Rp 45.000",
                desc: "✨ Marine Velvet Parfum unisex dengan karakter fresh marine – aromatic – woody. Bersih , modern , dan elegan untuk pemakaian sehari-hari",
                size: "ZARA Parfums 10ml",
                img: "../img-perfumes/Marine Velvet.jpeg",
                wa: "https://wa.me/6285737416686?text=Halo kak, saya mau Order Marine Velvet",
                shopee: "https://id.shp.ee/4y1W7k1"
            },
            sexy: {
                name: "Sexy Lady",
                price: "Rp 45.000",
                desc: "✨ Sexy Lady Wangi Elegant Sexy & Fresh",
                size: "ZARA Parfums 10ml",
                img: "../img-perfumes/Sexy Lady.jpeg",
                wa: "https://wa.me/6285737416686?text=Halo kak, saya mau Order Sexy Lady",
                shopee: "https://id.shp.ee/4y1W7k1"
            }
        };

        const params = new URLSearchParams(window.location.search);
        const item = params.get("item");

        if (!item || !data[item]) {
            document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Roboto;
      text-align:center;
      color:white;
      padding:20px;
    ">
      <div style="
        background:#111;
        padding:30px;
        border-radius:20px;
        max-width:320px;
      ">
        <h2 style="color:#ee73b2">Product not found</h2>
        <p>This perfume does not exist.</p>
        <a href="catalog.html" style="
          display:inline-block;
          margin-top:15px;
          padding:12px 20px;
          background:#ff6fa9;
          border-radius:30px;
          color:white;
          text-decoration:none;
        ">Back to Catalog</a>
      </div>
    </div>`;
            throw new Error("Invalid product");
        }

        const p = data[item];
        img.src = p.img;
        name.innerText = p.name;
        price.innerText = p.price;
        desc.innerText = p.desc;
        size.innerText = p.size;
        wa.href = p.wa;
        shopee.href = p.shopee;
    </script>

</body>

</html>
